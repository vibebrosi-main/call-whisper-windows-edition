[package]
name = "cw-core"
version = "0.1.0"
edition = "2021"
description = "Czysta logika call-whisper: tekst, transkrypt, markdown, DSP, diaryzacja, wykrywanie pytań."
publish = false

[lib]
name = "cw_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
