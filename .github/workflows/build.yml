# Każdy push na main: testy, instalator .exe i wydanie na GitHubie.
# Zainstalowana aplikacja sama sprawdza `latest.json` z ostatniego wydania
# i aktualizuje się (tylko pobiera — niczego nie wysyła).
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Nowy push anuluje build poprzedniego — wydanie ma powstać z najnowszego.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  WHISPER_CPP_VERSION: v1.7.6

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Testy rdzenia
        run: cargo test -p cw-core

      - name: Cache silnika mowy
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: vendor/whisper
          key: whisper-${{ env.WHISPER_CPP_VERSION }}-vulkan-cpu-v1

      - name: Vulkan SDK
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: false
          cache: true

      # Dwie wersje: Vulkan (każde GPU) i CPU (zapas, gdy sterownik nie
      # obsługuje Vulkana). Statycznie, żeby nie wozić DLL-i ggml.
      # Instrukcje CPU ustawione jawnie, a nie „native": build ma ruszyć
      # na każdym procesorze z AVX2 (od ~2013), nie tylko na maszynie CI.
      - name: Buduję whisper.cpp
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:WHISPER_CPP_VERSION https://github.com/ggml-org/whisper.cpp whisper-src
          $common = @("-DBUILD_SHARED_LIBS=OFF", "-DWHISPER_BUILD_TESTS=OFF", "-DWHISPER_BUILD_EXAMPLES=ON",
                      "-DWHISPER_BUILD_SERVER=ON", "-DGGML_NATIVE=OFF", "-DGGML_AVX=ON", "-DGGML_AVX2=ON",
                      "-DGGML_FMA=ON", "-DGGML_F16C=ON", "-DWHISPER_SDL2=OFF")
          cmake -S whisper-src -B build-vulkan @common -DGGML_VULKAN=ON
          cmake --build build-vulkan --config Release --target whisper-server -j 4
          cmake -S whisper-src -B build-cpu @common
          cmake --build build-cpu --config Release --target whisper-server -j 4
          New-Item -ItemType Directory -Force vendor/whisper/vulkan, vendor/whisper/cpu | Out-Null
          Copy-Item build-vulkan/bin/Release/*.exe vendor/whisper/vulkan/
          Copy-Item build-vulkan/bin/Release/*.dll vendor/whisper/vulkan/ -ErrorAction SilentlyContinue
          Copy-Item build-cpu/bin/Release/*.exe vendor/whisper/cpu/
          Copy-Item build-cpu/bin/Release/*.dll vendor/whisper/cpu/ -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse vendor/whisper

      # ffmpeg do importu nagrań i wideo (mp4, mov, m4a, mp3...).
      - name: ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          # Suma od wydawcy: uszkodzony albo podmieniony plik nie trafi do instalatora.
          $expected = (Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip.sha256).Content.Trim().Split(" ")[0]
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash
          if ($actual -ne $expected.ToUpper()) { throw "ffmpeg: zła suma SHA-256 ($actual != $expected)" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-src
          New-Item -ItemType Directory -Force vendor/ffmpeg | Out-Null
          Get-ChildItem -Recurse ffmpeg-src -Filter ffmpeg.exe | Select-Object -First 1 | Copy-Item -Destination vendor/ffmpeg/

      # Rozpoznawanie głosów po rozmowie: sherpa-onnx (pyannote + CAM++), to
      # samo co na macOS. Sumy SHA-256 sprawdzane przed rozpakowaniem.
      - name: Silnik rozpoznawania głosów
        shell: pwsh
        run: |
          function Fetch($url, $out, $sha) {
            Invoke-WebRequest $url -OutFile $out
            $actual = (Get-FileHash $out -Algorithm SHA256).Hash
            if ($actual -ne $sha.ToUpper()) { throw "$out: zła suma SHA-256 ($actual)" }
          }
          Fetch https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.23/sherpa-onnx-v1.12.23-win-x64-shared-MT-Release-no-tts.tar.bz2 sherpa.tar.bz2 81f08f3f12a0d2377923eca3b288b895e1d18e45a1eb99478e3a32a43c58b9c0
          Fetch https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2 seg.tar.bz2 24615ee884c897d9d2ba09bb4d30da6bb1b15e685065962db5b02e76e4996488
          Fetch https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx emb.onnx 357a834f702b80161e5b981182c038e18553c1f2ca752ed6cec2052365d4129b
          tar -xjf sherpa.tar.bz2
          tar -xjf seg.tar.bz2
          New-Item -ItemType Directory -Force vendor/sherpa | Out-Null
          $dir = Get-ChildItem -Directory sherpa-onnx-v1.12.23-win-x64* | Select-Object -First 1
          Get-ChildItem -Recurse $dir -Filter sherpa-onnx-offline-speaker-diarization.exe | Select-Object -First 1 | Copy-Item -Destination vendor/sherpa/
          # Windows szuka DLL obok programu.
          Get-ChildItem -Recurse $dir -Filter *.dll | Copy-Item -Destination vendor/sherpa/
          Copy-Item sherpa-onnx-pyannote-segmentation-3-0/model.onnx vendor/sherpa/segmentation.onnx
          Copy-Item emb.onnx vendor/sherpa/embedding.onnx
          Get-ChildItem vendor/sherpa

      # Wersja rośnie z każdym buildem — inaczej updater nie widzi nowości.
      - name: Wersja
        shell: pwsh
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          $version = "0.1.${{ github.run_number }}"
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $version
          # Bez klucza updatera instalator i tak powstaje, tylko bez
          # paczki do samoczynnej aktualizacji.
          if ($env:HAS_KEY -ne "true") { $conf.bundle.createUpdaterArtifacts = $false }
          $conf | ConvertTo-Json -Depth 32 | Set-Content src-tauri/tauri.conf.json -Encoding utf8
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Instalator
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: src-tauri
          tagName: ${{ github.event_name == 'push' && format('v{0}', env.VERSION) || '' }}
          releaseName: call-whisper ${{ env.VERSION }}
          releaseBody: Instalator call-whisper-${{ env.VERSION }} dla Windows. Pobierz plik *_x64-setup.exe i uruchom.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # Instalator bez silnika albo ffmpeg „działa", ale nic nie transkrybuje.
      - name: Sprawdzam zasoby w paczce
        shell: pwsh
        run: |
          foreach ($f in "vendor/whisper/vulkan/whisper-server.exe", "vendor/whisper/cpu/whisper-server.exe", "vendor/ffmpeg/ffmpeg.exe",
                    "vendor/sherpa/sherpa-onnx-offline-speaker-diarization.exe", "vendor/sherpa/segmentation.onnx", "vendor/sherpa/embedding.onnx") {
            if (-not (Test-Path "target/release/$f")) { throw "Brak $f w paczce" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: call-whisper-setup
          path: target/release/bundle/nsis/*.exe
